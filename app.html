<title>Il mio bilancio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: green header band (account selector, balance, SPESE/ENTRATE), period card with large donut and yellow add button,
   category cards. Side menu: off-canvas on phones, fixed column on desktop where the period card and the list sit side by side. */
/* Nuovo design: carta calda, verde bosco, corallo. Barra in basso a 5 sezioni (a sinistra su desktop). */
:root{
  --bg:#EAF1FB; --card:#FFFFFF; --sunk:#DCE8F7; --ink:#0F2342; --muted:#4F6288; --faint:#7C8EAF; --line:#D0DEF2; --hover:#DFEAF9;
  --bnc:var(--faint); --bnca:var(--accent); --bnp:var(--accent-soft); --brand:#1D4ED8; --brand-2:#1A44BD; --brand-grad:none; --drawer-bg:none;
  --on-brand:#0F2342; --on-brand-2:#4F6288; --on-brand-3:rgba(15,35,66,.08);
  --accent:#1D5FE0; --accent-soft:#DAE6FF; --accent-ink:#FFFFFF;
  --fab:#1D5FE0; --fab-ink:#FFFFFF;
  --in:#0F8F6A; --in-soft:#D9F2EA; --out:#D13B4F; --out-soft:#FBE1E5; --tr:#5B6E94; --warn:#B7791F; --warn-soft:#F6E8C8;
  --shadow:0 1px 2px rgba(20,50,110,.07),0 10px 28px rgba(20,50,110,.12);
  --k-red:#E5484D; --k-wine:#C2306B; --k-orange:#F07A22; --k-amber:#EBA21B; --k-olive:#A89A14; --k-lime:#74B72E; --k-green:#2FA463;
  --k-teal:#1FA38B; --k-cyan:#1AA6C4; --k-sky:#4DA8E8; --k-blue:#3E7BE0; --k-indigo:#5B5FD6; --k-violet:#8460E0; --k-purple:#A94FD0;
  --k-pink:#E8508C; --k-brown:#9C6B45; --k-slate:#66737F;
  --f:Arial,'Helvetica Neue',Helvetica,sans-serif; --fd:Arial,'Helvetica Neue',Helvetica,sans-serif;
  --r:20px; --rail:96px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1325; --card:#121E38; --sunk:#0E182E; --ink:#EAF1FF; --muted:#9DB0D6; --faint:#7487B0; --line:#223256; --hover:#1A294A;
  --bnc:#E4EBFA; --bnca:#fff; --bnp:rgba(255,255,255,.18); --brand:#2A5FD8; --brand-2:#2250B8;
  --on-brand:#EAF1FF; --on-brand-2:#9DB0D6; --on-brand-3:rgba(255,255,255,.08);
  --accent:#6FA3FF; --accent-soft:#1B2D57; --accent-ink:#0A1325;
  --fab:#4B86FF; --fab-ink:#06122B;
  --in:#4FD6AB; --in-soft:#12352E; --out:#FF7A8C; --out-soft:#3B1D28; --tr:#9DB0D6; --warn:#E8B04A; --warn-soft:#38301A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1325; --card:#121E38; --sunk:#0E182E; --ink:#EAF1FF; --muted:#9DB0D6; --faint:#7487B0; --line:#223256; --hover:#1A294A;
  --bnc:#E4EBFA; --bnca:#fff; --bnp:rgba(255,255,255,.18); --brand:#2A5FD8; --brand-2:#2250B8;
  --on-brand:#EAF1FF; --on-brand-2:#9DB0D6; --on-brand-3:rgba(255,255,255,.08);
  --accent:#6FA3FF; --accent-soft:#1B2D57; --accent-ink:#0A1325;
  --fab:#4B86FF; --fab-ink:#06122B;
  --in:#4FD6AB; --in-soft:#12352E; --out:#FF7A8C; --out-soft:#3B1D28; --tr:#9DB0D6; --warn:#E8B04A; --warn-soft:#38301A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.c-in{color:var(--in)} .c-out{color:var(--out)} .c-tr{color:var(--tr)}

/* ---------- navigazione ---------- */
.shell{min-height:100vh}
/* ---------- header ---------- */
.hdr{background:var(--brand-grad);color:var(--on-brand);padding:12px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.hdr-in{max-width:1180px;margin:0 auto}
.hdr-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:52px}
.hb{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--on-brand);display:grid;place-items:center}
.hb:hover{background:var(--on-brand-3)}
.hb.sm{width:34px;height:34px}
.menu-btn{display:none}
.accsel{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.accname{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--on-brand);font-size:20px;font-weight:600;padding:2px 4px;border-radius:10px;max-width:100%}
.accname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accname:hover{background:var(--on-brand-3)}
.accbal{display:flex;align-items:center;gap:4px;padding-left:4px}
.accbal .amt{font-size:32px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.htitle{font-size:21px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttabs{display:flex;max-width:440px;margin-top:6px}
.ttabs button{flex:1;border:0;background:none;color:var(--on-brand-2);font-size:17px;font-weight:600;letter-spacing:.04em;padding:10px 6px 11px;border-bottom:3px solid transparent}
.ttabs button[aria-selected="true"]{color:var(--on-brand);border-bottom-color:var(--on-brand)}
.hdr-actions{display:flex;align-items:center;gap:6px}
.hbtn{border:1px solid rgba(255,255,255,.35);background:none;color:var(--on-brand);border-radius:999px;padding:7px 14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.hbtn:hover{background:var(--on-brand-3)}

main.main{max-width:1180px;margin:0 auto;padding:18px max(20px,env(safe-area-inset-right,0px)) 96px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}

/* ---------- cards & period ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px;min-width:0;position:relative}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:600;margin:0}
.ptabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;justify-content:space-between;margin:-4px -4px 0}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{border:0;background:none;color:var(--muted);font-size:16px;padding:8px 8px 9px;border-bottom:3px solid transparent;white-space:nowrap;flex:1 0 auto}
.ptabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.pnav{display:flex;align-items:center;justify-content:center;gap:4px;margin:10px 0 2px;min-height:44px}
.navbtn{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--ink);display:grid;place-items:center}
.navbtn:hover{background:var(--hover)} .navbtn[disabled]{opacity:.25;cursor:default}
.navbtn.sm{width:36px;height:36px;color:var(--muted)}
.plabel{border:0;background:none;font-size:17px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--faint);padding:6px 8px;flex:1;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dcard{padding-bottom:18px}
.donut-area{display:grid;place-items:center;padding:6px 0 4px}
.dwrap{position:relative;width:min(300px,78vw);aspect-ratio:1;max-width:100%;container-type:inline-size}
.dwrap svg{width:100%;height:100%;display:block}
.dctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dctr b{font-weight:500;letter-spacing:-.01em;line-height:1.1}
.dctr span{font-size:13px;color:var(--muted)}
.fab{width:62px;height:62px;border-radius:22px;border:0;background:var(--fab);color:var(--fab-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(255,176,32,.45)}
.fab:hover{filter:brightness(1.05)}
.fab.in-card{position:absolute;right:14px;bottom:14px}
.fab.fixed{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:20}

.home{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
.home-left{position:sticky;top:14px;display:flex;flex-direction:column;gap:12px}
.home-right{display:flex;flex-direction:column;gap:8px;min-width:0}

/* category cards */
.ccard{background:var(--card);border-radius:18px;overflow:hidden}
.ccard-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left}
.ccard-h:hover{background:var(--hover)}
.ccard-h .cn{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard-h .cp{color:var(--muted);font-size:15px;min-width:42px;text-align:right}
.ccard-h .cv{font-size:17px;font-weight:500;min-width:84px;text-align:right}
.ccard-h .chev{color:var(--faint);transition:transform .2s}
.ccard.open .chev{transform:rotate(180deg)}
.ccard-b{border-top:1px solid var(--line);padding:4px 8px 8px}
.tx{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 6px;border-radius:10px;text-align:left}
.tx:hover{background:var(--hover)}
.tx .d{font-size:12.5px;color:var(--muted);line-height:1.2}
.tx .m{display:flex;flex-direction:column;min-width:0}
.tx .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:500}
.more{display:block;width:100%;border:0;background:none;color:var(--accent);font-weight:500;padding:8px;text-align:center}
.empty-card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);padding:28px 16px}
.empty-card p{margin:0}

/* alerts */
.alert{padding:12px 14px}
.alert-h{display:flex;align-items:center;gap:8px;color:var(--warn);margin-bottom:6px}
.alert-h b{color:var(--ink);font-weight:600}
.arow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.am{flex:1;min-width:0;display:flex;flex-direction:column}
.am .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am .t2{font-size:12.5px;color:var(--muted)}

/* icon badges */
.ci{--c:var(--k-slate);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.ci.sm{width:38px;height:38px}
.ci.lg{width:56px;height:56px}
.ci.xl{width:68px;height:68px}

/* rows / lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;border:0;background:none;width:100%;text-align:left}
button.row:hover{background:var(--hover)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;flex-direction:column;align-items:flex-end}
.row .end .amt{font-weight:600}
.chkrow{cursor:pointer}
.chkrow input{width:20px;height:20px;accent-color:var(--accent)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:16px 8px 6px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:2px}
.dayh:first-child{padding-top:2px}
.tagchip{font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;justify-content:center}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--out);border-color:color-mix(in srgb,var(--out) 35%,transparent)}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--hover);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.input,select.input{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar>.input{width:auto}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .input{padding-left:38px;width:100%}
.sumline{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:14px 0 2px}
.sumline b{color:var(--ink);font-weight:600}
.banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 6px;font-weight:500}
.chipbtn:hover{background:var(--hover)}
.narrow{max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* progress / budget */
.bar{height:8px;border-radius:99px;background:var(--hover);position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.bar>i.ok{background:linear-gradient(90deg,#12C2A0,#FFB020)} .bar>i.warn{background:var(--warn)} .bar>i.over{background:var(--out)}
.bar>i.pl{background:repeating-linear-gradient(135deg,var(--out) 0 4px,transparent 4px 8px);opacity:.38;border-radius:0 99px 99px 0}
.bar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.bud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 4px}
.bud .bar{grid-column:2/4}
.bud .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.bud .rt{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.bud .rt b{color:var(--ink);font-weight:600}
.bud .ci{grid-row:span 2}
.bud .note{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.budin{width:92px;text-align:right;border:1px solid var(--accent);border-radius:8px;padding:4px 8px;background:var(--card)}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--in-soft);color:var(--in)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.over{background:var(--out-soft);color:var(--out)} .pill.neutral{background:var(--hover);color:var(--muted)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.plot{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ax{fill:var(--faint);font-size:11px;font-family:var(--f)}
.ax.on{fill:var(--ink);font-weight:600}
.zero{stroke:var(--line);stroke-width:1}
.b-in{fill:var(--in)} .b-out{fill:var(--out)}
.hit{fill:transparent;cursor:pointer} .hit:hover{fill:var(--hover)}
.selb{fill:var(--accent-soft)}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--accent);opacity:.12}
.lp{fill:var(--accent)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lab{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile .v{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:12.5px;color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:0;background:none;padding:4px;border-radius:10px;text-align:left;width:100%}
.hbar:hover{background:var(--hover)}
.hbar .ci{grid-row:span 2}
.hbar .bar{grid-column:2/4;height:7px}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t thead th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
table.t td{font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--hover)}

/* category tiles */
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ctile{background:var(--card);border:0;border-radius:14px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ctile:hover{background:var(--hover)}
.ctile .cn{font-weight:500;line-height:1.25}
.ctile .cc{font-size:12.5px;color:var(--muted)}
.ctile.new{border:2px dashed var(--line);background:none;color:var(--muted);justify-content:center}

/* accounts */
.accrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 14px}
.accrow .ci{grid-row:span 2}
.accrow .an{font-size:17px;font-weight:500}
.accrow .ab{font-size:20px;font-weight:600;text-align:right}
.accrow .aa{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}

/* sheets & dialogs */
.overlay{position:fixed;inset:0;background:rgba(6,10,8,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:20px;box-shadow:var(--shadow);width:min(600px,100%);max-height:calc(100% - 24px);overflow:auto;padding:20px 22px 22px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{font-size:21px;font-weight:600;margin:0}
.round{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.round:hover{background:var(--hover)}
.dlg{background:var(--card);border-radius:18px;box-shadow:var(--shadow);width:min(440px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;padding:22px 22px 10px;gap:12px;overflow:hidden}
.dlg-t{font-size:24px;font-weight:500;margin:0}
.dlg-sub{margin:2px 0 0;color:var(--muted);font-size:16px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:6px 0 4px}
.tbtn{border:0;background:none;color:var(--accent);font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:10px 12px;border-radius:10px;font-size:15px}
.tbtn:hover{background:var(--accent-soft)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:var(--muted)}
.switchrow input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(s){const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]||1)}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/864e5)+1}
function cap(s){s=String(s||"");return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function byKey(list,t,kf){const o=new Map();for(const x of list)if(x.t===t){const k=kf(x);o.set(k,(o.get(k)||0)+x.v)}return o}
function dueText(d){if(d===TODAY)return"oggi";if(d===addDays(TODAY,-1))return"ieri";if(d===addDays(TODAY,1))return"domani";if(d<TODAY)return"dal "+fmtDate(d,{day:"numeric",month:"short"});return fmtDate(d,{weekday:"short",day:"numeric",month:"short"})}

/* ================= periods ================= */
function range(p){p=p||S.p;const a=p.anchor,d=pd(a);
  switch(p.mode){
    case"day":return[a,a];
    case"week":{const st=addDays(a,-((d.getDay()+6)%7));return[st,addDays(st,6)]}
    case"month":return[iso(new Date(d.getFullYear(),d.getMonth(),1)),iso(new Date(d.getFullYear(),d.getMonth()+1,0))];
    case"year":return[d.getFullYear()+"-01-01",d.getFullYear()+"-12-31"];
    case"all":{const lo=S.list.length?S.list[S.list.length-1].d:TODAY;const hi=S.list.length&&S.list[0].d>TODAY?S.list[0].d:TODAY;return[lo<TODAY?lo:TODAY,hi]}
    default:{let f=p.from||addDays(TODAY,-29),t=p.to||TODAY;if(f>t){const z=f;f=t;t=z}return[f,t]}
  }}
function plabel(){const [a,b]=range();const d=pd(S.p.anchor);const y=TODAY.slice(0,4);
  switch(S.p.mode){
    case"day":{const x=pd(a);const base=x.getDate()+" "+MESI[x.getMonth()]+(a.slice(0,4)!==y?" "+a.slice(0,4):"");const g=" ("+GG[x.getDay()]+")";
      if(a===TODAY)return"Oggi, "+base+g;if(a===addDays(TODAY,-1))return"Ieri, "+base+g;return base+g}
    case"week":return sd(a)+" – "+sd(b)+(b.slice(0,4)!==y?" "+b.slice(0,4):"");
    case"month":return cap(MESI[d.getMonth()])+" "+d.getFullYear();
    case"year":return String(d.getFullYear());
    case"all":return"Tutti i tempi";
    default:return sd(a)+(a.slice(0,4)!==b.slice(0,4)?" "+a.slice(0,4):"")+" – "+sd(b)+" "+b.slice(0,4);
  }}
function shift(dir){const p=S.p,d=pd(p.anchor);
  if(p.mode==="day")p.anchor=addDays(p.anchor,dir);
  else if(p.mode==="week")p.anchor=addDays(p.anchor,7*dir);
  else if(p.mode==="month")p.anchor=iso(new Date(d.getFullYear(),d.getMonth()+dir,1));
  else if(p.mode==="year")p.anchor=iso(new Date(d.getFullYear()+dir,0,1));
  else if(p.mode==="custom"){const [a,b]=range();const n=daysBetween(a,b);p.from=addDays(a,n*dir);p.to=addDays(b,n*dir)}
  S.shown=150;render()}
function setMode(m){S.p.mode=m;if(m!=="custom")lsSet("pmode",m);S.shown=150;render()}
function inRange(r){r=r||range();return S.list.filter(x=>x.d>=r[0]&&x.d<=r[1])}
function elapsedDays(r){const end=r[1]<TODAY?r[1]:TODAY;if(end<r[0])return 0;return daysBetween(r[0],end)}
function bins(){let r=range();const m=S.p.mode;let g;
  if(m==="day"){const d=pd(r[0]);const st=addDays(r[0],-((d.getDay()+6)%7));r=[st,addDays(st,6)];g="d"}
  else if(m==="week"||m==="month")g="d";else if(m==="year")g="m";else if(m==="all")g="y";
  else{const n=daysBetween(r[0],r[1]);g=n<=62?"d":n<=800?"m":"y"}
  const out=[];
  if(g==="d"){for(let s=r[0];s<=r[1];s=addDays(s,1)){const dd=pd(s);out.push({k:s,end:s,lab:(m==="week"||m==="day")?GG[dd.getDay()]+" "+dd.getDate():String(dd.getDate()),full:cap(fmtDate(s,{weekday:"long",day:"numeric",month:"long"})),go:{mode:"day",anchor:s}})}}
  else if(g==="m"){let d=pd(r[0]);d=new Date(d.getFullYear(),d.getMonth(),1);const e=pd(r[1]);while(d<=e){const k=iso(d).slice(0,7);out.push({k,end:iso(new Date(d.getFullYear(),d.getMonth()+1,0)),lab:MB[d.getMonth()]+(r[0].slice(0,4)!==r[1].slice(0,4)?" "+String(d.getFullYear()).slice(2):""),full:cap(MESI[d.getMonth()])+" "+d.getFullYear(),go:{mode:"month",anchor:k+"-01"}});d=new Date(d.getFullYear(),d.getMonth()+1,1)}}
  else{for(let y=+r[0].slice(0,4);y<=+r[1].slice(0,4);y++)out.push({k:String(y),end:y+"-12-31",lab:String(y),full:String(y),go:{mode:"year",anchor:y+"-01-01"}})}
  return{g,r,list:out}}

/* ================= data ================= */
function recompute(){const arr=[];for(const [id,x] of S.items)if(x&&typeof x.d==="string"&&isFinite(x.v))arr.push(Object.assign({id},x));
  arr.sort((a,b)=>b.d<a.d?-1:b.d>a.d?1:(b.ts||0)-(a.ts||0));S.list=arr}
function balances(upTo){const b=new Map();for(const a of cfg().accs)b.set(a.n,+a.init||0);
  for(const x of S.list){if(upTo&&x.d>upTo)continue;
    if(x.t==="E")b.set(x.a,(b.get(x.a)||0)+x.v);else if(x.t==="S")b.set(x.a,(b.get(x.a)||0)-x.v);else{b.set(x.a,(b.get(x.a)||0)-x.v);b.set(x.to,(b.get(x.to)||0)+x.v)}}
  for(const [k,v] of b)b.set(k,Math.round(v*100)/100);return b}
function totalBal(upTo){const b=balances(upTo);return Math.round(visibleAccs().reduce((s,a)=>s+(b.get(a.n)||0),0)*100)/100}
function curBal(){return S.acc?(balances(TODAY).get(S.acc)||0):totalBal(TODAY)}
function scopedSE(list){return list.filter(x=>x.t!=="T"&&(!S.acc||x.a===S.acc))}
function catAgg(list,t){const m=new Map();for(const x of list)if(x.t===t){const o=m.get(x.c)||{v:0,cnt:0};o.v+=x.v;o.cnt++;m.set(x.c,o)}
  const arr=[...m].map(([n,o])=>{const c=catInfo(t,n);return{n,v:Math.round(o.v*100)/100,cnt:o.cnt,k:c.k,i:c.i}}).sort((a,b)=>b.v-a.v);
  return{arr,tot:Math.round(arr.reduce((s,e)=>s+e.v,0)*100)/100}}
function tags(){const s=new Set();for(const x of S.list)if(x.g)s.add(x.g);return [...s].sort()}
function dueRic(){return cfg().ric.filter(r=>!r.auto&&r.next&&r.next<=TODAY)}
function duePro(){return cfg().prom.filter(p=>!p.f&&p.d&&p.d<=TODAY)}
/* planned movements: anything dated after today is "previsto" and only enters the balance on its date */
function isFut(x){return x.d>TODAY}
function scopeSet(acc){return acc?new Set([acc]):new Set(visibleAccs().map(a=>a.n))}
function deltaFor(x,set){if(x.t==="E")return set.has(x.a)?x.v:0;if(x.t==="S")return set.has(x.a)?-x.v:0;return (set.has(x.to)?x.v:0)-(set.has(x.a)?x.v:0)}
function ricOcc(until){const out=[];for(const r of cfg().ric){if(!r.next||!(r.v>0))continue;let d=r.next,k=0;
  while(d<=until&&k<400){out.push({id:"occ-"+r.id+"-"+d,virt:true,rid:r.id,d,t:r.t,c:r.c,a:r.a,to:"",v:r.v,n:r.n||"",g:"",pending:d<=TODAY,ts:0});d=nextDate(r,d);k++}}return out}
function upcoming(until,acc){const set=scopeSet(acc);const inScope=x=>x.t==="T"?(set.has(x.a)||set.has(x.to)):set.has(x.a);
  return S.list.filter(x=>x.d>TODAY&&x.d<=until&&inScope(x)).concat(ricOcc(until).filter(inScope)).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)}
function balScope(acc){const b=balances(TODAY);let s=0;for(const n of scopeSet(acc))s+=b.get(n)||0;return Math.round(s*100)/100}
function projBal(until,acc){const set=scopeSet(acc);let s=balScope(acc);for(const x of upcoming(until,acc))s+=deltaFor(x,set);return Math.round(s*100)/100}
function monthEnd(d){const x=pd(d);return iso(new Date(x.getFullYear(),x.getMonth()+1,0))}

/* ================= storage backends ================= */
let wq=Promise.resolve();
function queue(fn){const p=wq.then(fn,fn);wq=p.catch(()=>{});return p}
function gasCall(fn,...args){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)})}
const B={
  kind:"local",
  async start(){
    if(window.google&&google.script&&google.script.run){this.kind="gas";S.mode="gas";await this.gasLoad();setTimeout(afterLoad,0);if(window.__bilOffline)setTimeout(()=>toast("Sei offline: vedi i dati dell'ultima apertura"),300);
      document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-this.last>20000&&!S.sheet)this.gasLoad().then(render).catch(()=>{})});
      return}
    const cl=window.claude;let db=null;
    if(cl&&cl.use){try{db=await cl.use("db")}catch(e){db=null}cl.use("downloads").then(d=>{S.dl=d||null}).catch(()=>{})}
    if(!db){this.kind="local";S.mode="local";S.ready=true;S.lastSync=null;render();return}
    this.kind="claude";S.mode="claude";this.db=db;
    const got={tx:false,cfg:false};const done=()=>{if(got.tx&&got.cfg&&!S.ready){S.ready=true;setTimeout(afterLoad,0)}S.lastSync=new Date();render()};
    const fail=e=>{if(e&&e.code==="revoked")S.ro=true;render()};
    db.collection("tx").onSnapshot(snap=>{const items=new Map();for(const d of snap.docs){const it=((d.data()||{}).items)||{};for(const k in it)items.set(k,it[k])}
      S.items=items;recompute();got.tx=true;done()},fail);
    db.doc("impostazioni/app").onSnapshot(s=>{const raw=s.exists?s.data():null;S.cfgV=raw?(raw.v||2):0;S.cfg=migrate(raw);got.cfg=true;done()},fail);
    db.collection("investimenti").onSnapshot(snap=>{const m=new Map();for(const d of snap.docs){const x=d.data();if(x)m.set(d.id,x)}S.inv=m;if(S.view==="investimenti")render()},fail);
  },
  async gasLoad(){const raw=await gasCall("getData");window.__bilFresh=r=>{try{this.apply(r);if(!S.sheet)render()}catch(e){}};this.apply(raw)},
  apply(raw){const data=typeof raw==="string"?JSON.parse(raw):raw;
    S.items=new Map(Object.entries(data.items||{}));S.inv=new Map(Object.entries(data.inv||{}));S.cfgV=data.cfg?(data.cfg.v||2):0;S.cfg=migrate(data.cfg||null);
    recompute();S.ready=true;S.ro=!!window.__bilOffline;this.last=Date.now();S.lastSync=new Date()},
  saveTx(id,item,prev){S.items.set(id,item);recompute();
    if(this.kind==="local")return Promise.resolve();
    if(this.kind==="gas")return queue(()=>gasCall("saveItems",JSON.stringify([Object.assign({id},item)])));
    const db=this.db;const m=item.d.slice(0,7),pm=prev?prev.d.slice(0,7):null;
    return queue(async()=>{if(pm&&pm!==m)await this._remove(pm,[id]);
      const ref=db.doc("tx/"+m);const snap=await ref.get();if(snap.exists)await ref.update({items:{[id]:item}});else await ref.set({items:{[id]:item}})})},
  delTx(id){const prev=S.items.get(id);S.items.delete(id);recompute();
    if(this.kind==="local"||!prev)return Promise.resolve();
    if(this.kind==="gas")return queue(()=>gasCall("deleteItems",JSON.stringify([id])));
    return queue(()=>this._remove(prev.d.slice(0,7),[id]))},
  async _remove(m,ids){const ref=this.db.doc("tx/"+m);const snap=await ref.get();if(!snap.exists)return;
    const items=Object.assign({},(snap.data()||{}).items||{});for(const id of ids)delete items[id];
    if(Object.keys(items).length)await ref.set({items});else await ref.delete()},
  saveMany(map){for(const [id,it] of map)S.items.set(id,it);recompute();
    if(this.kind==="local")return Promise.resolve();
    const arr=[...map].map(([id,it])=>Object.assign({id},it));
    if(this.kind==="gas")return queue(async()=>{for(let i=0;i<arr.length;i+=400)await gasCall("saveItems",JSON.stringify(arr.slice(i,i+400)))});
    const byM=new Map();for(const [id,it] of map){const m=it.d.slice(0,7);if(!byM.has(m))byM.set(m,{});byM.get(m)[id]=it}
    return queue(async()=>{for(const [m,items] of byM){const ref=this.db.doc("tx/"+m);const snap=await ref.get();if(snap.exists)await ref.update({items});else await ref.set({items})}})},
  saveCfg(c){S.cfg=c;S.cfgV=c.v||3;
    if(this.kind==="local")return Promise.resolve();
    if(this.kind==="gas")return queue(()=>gasCall("saveCfg",JSON.stringify(c)));
    return queue(()=>this.db.doc("impostazioni/app").set(c))},
  saveInv(id,obj){S.inv.set(id,obj);if(this.kind==="local")return Promise.resolve();
    if(this.kind==="gas")return queue(()=>gasCall("saveInv",JSON.stringify(Object.assign({id},obj))));
    return queue(()=>this.db.collection("investimenti").doc(id).set(obj))},
  delInv(id){S.inv.delete(id);if(this.kind==="local")return Promise.resolve();
    if(this.kind==="gas")return queue(()=>gasCall("deleteInv",id));
    return queue(()=>this.db.collection("investimenti").doc(id).delete())}
};
async function write(p,ok){
  if(S.ro){toast("Puoi consultare i dati ma non modificarli.");return false}
  try{await p;if(ok)toast(ok);S.lastSync=new Date();renderDrawer();return true}
  catch(e){const code=e&&e.code;
    if(code==="invalid_argument"){S.ro=true;toast("Non hai il permesso di modificare questi dati.")}
    else if(code==="quota_exceeded")toast("Spazio esaurito: non è stato possibile salvare.");
    else toast("Salvataggio non riuscito. Controlla la connessione e riprova.");
    if(B.kind==="gas")B.gasLoad().then(render).catch(()=>{});
    render();return false}}

/* ================= recurring payments & reminders ================= */
function nextDate(r,d){const n=Math.max(1,+r.ev||1);const x=pd(d);
  if(r.fq==="d")return addDays(d,n);if(r.fq==="w")return addDays(d,7*n);
  const months=r.fq==="y"?12*n:n;const tm=x.getMonth()+months;const y=x.getFullYear()+Math.floor(tm/12),m=((tm%12)+12)%12;
  const dim=new Date(y,m+1,0).getDate();return iso(new Date(y,m,Math.min(r.g||x.getDate(),dim)))}
function ricItem(r,d){return{d,t:r.t,c:r.c,a:r.a,to:"",v:r.v,n:r.n||"",g:"",ts:pd(d).getTime()+500}}
function ricId(r,d){return "r-"+r.id+"-"+d}
async function processRecurring(){
  if(S.ro||S.mode==="local"&&!S.cfg)return;
  const c=clone();let changed=false;const m=new Map();
  for(const r of c.ric){if(!r.auto||!r.next)continue;let k=0;while(r.next<=TODAY&&k<120){const id=ricId(r,r.next);if(!S.items.has(id))m.set(id,ricItem(r,r.next));r.next=nextDate(r,r.next);k++;changed=true}}
  if(m.size)await write(B.saveMany(m),m.size===1?"Registrato 1 pagamento regolare":"Registrati "+m.size+" pagamenti regolari");
  if(changed)await write(B.saveCfg(c));
  if(m.size||changed)render()}
async function ricRegister(id,skip){const c=clone();const r=c.ric.find(x=>x.id===id);if(!r)return;const d=r.next;r.next=nextDate(r,d);
  if(!skip){const m=new Map([[ricId(r,d),ricItem(r,d)]]);await write(B.saveMany(m),"Pagamento registrato")}
  await write(B.saveCfg(c),skip?"Scadenza saltata":null);render()}
function promNext(p){let d=p.d;let k=0;do{const x=pd(d);if(p.rip==="w")d=addDays(d,7);else if(p.rip==="m")d=iso(new Date(x.getFullYear(),x.getMonth()+1,Math.min(p.g||x.getDate(),new Date(x.getFullYear(),x.getMonth()+2,0).getDate())));else d=iso(new Date(x.getFullYear()+1,x.getMonth(),x.getDate()));k++}while(d<=TODAY&&k<500);return d}
async function promDone(id){const c=clone();const p=c.prom.find(x=>x.id===id);if(!p)return;
  if(p.rip){p.d=promNext(p)}else{p.f=true;p.fd=TODAY}
  await write(B.saveCfg(c),p.rip?"Fatto. Prossimo promemoria il "+fmtDate(p.d,{day:"numeric",month:"long"}):"Promemoria completato");render()}
async function afterLoad(){
  if(S.cfg&&S.cfgV<3&&!S.ro&&S.mode!=="local")await write(B.saveCfg(S.cfg));
  await processRecurring();deepLink()}

function bigDonut(arr,tot,t,fut){

  else{let a0=-Math.PI/2;const gap=arr.length>1?0.014:0;
    arr.forEach((e,i)=>{const frac=e.v/tot;const a1=a0+frac*2*Math.PI;const col="var(--k-"+esc(e.k)+")";
      const x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);
      defs+='<linearGradient id="dg'+i+'" gradientUnits="userSpaceOnUse" x1="'+x0.toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+x1.toFixed(1)+'" y2="'+y1.toFixed(1)+'"><stop offset="0" style="stop-color:'+col+'"/><stop offset="1" style="stop-color:'+col+';stop-opacity:.74"/></linearGradient>';
      const title="<title>"+esc(e.n)+": "+short(e.v)+" ("+pctI(frac)+")</title>";
      if(frac>=0.9999)segs+='<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="'+W+'">'+title+"</circle>";
      else{const s=a0+gap/2,en=a1-gap/2;if(en>s){const sx=C+R*Math.cos(s),sy=C+R*Math.sin(s),ex=C+R*Math.cos(en),ey=C+R*Math.sin(en);
        segs+='<path d="M'+sx.toFixed(2)+" "+sy.toFixed(2)+"A"+R+" "+R+" 0 "+(en-s>Math.PI?1:0)+" 1 "+ex.toFixed(2)+" "+ey.toFixed(2)+'" fill="none" stroke="url(#dg'+i+')" stroke-width="'+W+'" data-catpage="'+t+"|"+esc(e.n)+'" style="cursor:pointer">'+title+"</path>"}}

function trendSvg(list){const bz=bins();const kf=bz.g==="d"?x=>x.d:bz.g==="m"?x=>x.d.slice(0,7):x=>x.d.slice(0,4);const E=new Map(),U=new Map();
  const r=range();const src=bz.r[0]===r[0]&&bz.r[1]===r[1]?list:scopedSE(S.list.filter(x=>x.d>=bz.r[0]&&x.d<=bz.r[1]));
  for(const x of src){if(x.t==="E")E.set(kf(x),(E.get(kf(x))||0)+x.v);else if(x.t==="S")U.set(kf(x),(U.get(kf(x))||0)+x.v)}
  const n=bz.list.length;const maxE=Math.max(0,...bz.list.map(b=>E.get(b.k)||0)),maxU=Math.max(0,...bz.list.map(b=>U.get(b.k)||0));
  if(!maxE&&!maxU)return'<p class="muted" style="margin:0">Nessun movimento in questo periodo.</p>';
  const W=720,H=250,L=8,R=8,T=20,Bm=26;const ih=H-T-Bm;const tot=maxE+maxU||1;const y0=T+ih*(maxE/tot);const sc=ih/tot;
  const cw=(W-L-R)/n,bw=Math.max(2,Math.min(26,cw*.62));const every=Math.ceil(n/14);const selK=S.p.mode==="day"?S.p.anchor:null;
  let g='<line class="zero" x1="'+L+'" x2="'+(W-R)+'" y1="'+y0+'" y2="'+y0+'"/>';
  bz.list.forEach((b,i)=>{const x0=L+i*cw,cx=x0+cw/2;const e=E.get(b.k)||0,u=U.get(b.k)||0;const fb=(bz.g==="d"?b.k:bz.g==="m"?b.k+"-01":b.k+"-01-01")>TODAY?" fb":"";
    if(selK===b.k)g+='<rect class="selb" x="'+(x0+1)+'" y="'+T+'" width="'+(cw-2)+'" height="'+ih+'" rx="4"/>';
    g+='<rect class="hit" data-go="'+i+'" x="'+x0+'" y="'+(T-6)+'" width="'+cw+'" height="'+(ih+12)+'" rx="4"><title>'+esc(b.full)+(fb?" (previsto)":"")+" · entrate "+money(e)+" · spese "+money(u)+"</title></rect>";
    if(e)g+='<rect class="b-in'+fb+'" pointer-events="none" x="'+(cx-bw/2)+'" y="'+(y0-e*sc)+'" width="'+bw+'" height="'+Math.max(1,e*sc)+'" rx="'+Math.min(3,bw/3)+'"/>';
    if(u)g+='<rect class="b-out'+fb+'" pointer-events="none" x="'+(cx-bw/2)+'" y="'+y0+'" width="'+bw+'" height="'+Math.max(1,u*sc)+'" rx="'+Math.min(3,bw/3)+'"/>';
    if(i%every===0||n<=14)g+='<text class="ax'+(selK===b.k?" on":"")+'" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" pointer-events="none">'+esc(b.lab)+"</text>"});
  g+='<text class="ax" x="'+(W-R)+'" y="'+(T-6)+'" text-anchor="end">picco entrate '+eur0.format(maxE)+" · picco spese "+eur0.format(maxU)+"</text>";
  S._bins=bz.list;return'<div class="plot"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Entrate sopra la linea, spese sotto">'+g+"</svg></div>"}
function balanceSeries(){const bz=bins();const set=scopeSet(S.acc);
  let bal=[...set].reduce((s,n)=>s+(+accInfo(n).init||0),0);
  const virt=bz.r[1]>TODAY?ricOcc(bz.r[1]).map(x=>Object.assign({},x,{d:x.d<=TODAY?addDays(TODAY,1):x.d})):[];
  const asc=S.list.slice().reverse().concat(virt).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);let i=0;const out=[];
  for(const b of bz.list){
    while(i<asc.length&&asc[i].d<=b.end){const x=asc[i];if(x.t==="E"){if(set.has(x.a))bal+=x.v}else if(x.t==="S"){if(set.has(x.a))bal-=x.v}else{if(set.has(x.a))bal-=x.v;if(set.has(x.to))bal+=x.v}i++}
    out.push({lab:b.lab,full:b.full,v:Math.round(bal*100)/100,fut:b.end>TODAY})}
  return out}
function lineSvg(series){const pts=series.map((s,i)=>Object.assign({i},s)).filter(p=>p.v!=null);const act=pts.filter(p=>!p.fut);

function r2(v){return Math.round((v||0)*100)/100}

function budgetData(month){const c=cfg();const a=month+"-01",b=iso(new Date(+month.slice(0,4),+month.slice(5,7),0));
  const ex=S.list.filter(x=>x.t==="S"&&x.d>=a&&x.d<=b);const act=ex.filter(x=>x.d<=TODAY);
  const plan=ex.filter(x=>x.d>TODAY).concat(b>=TODAY?ricOcc(b).filter(x=>x.t==="S"&&x.d>=a):[]);
  const spent=byKey(act,"S",x=>x.c),planned=byKey(plan,"S",x=>x.c);const isCur=TODAY>=a&&TODAY<=b;const dim=daysBetween(a,b);const elapsed=isCur?daysBetween(a,TODAY):(TODAY>b?dim:0);
  const cb=c.budget||{};
  const rows=Object.entries(cb).filter(([,v])=>+v>0).map(([n,v])=>{const s=r2(spent.get(n)),p=r2(planned.get(n));return{n,b:+v,s,p,r:s/+v,info:catInfo("S",n)}}).sort((x,y)=>y.r-x.r);
  const nob=[...spent].filter(([n])=>!(+cb[n]>0)).map(([n,s])=>({n,s:r2(s),info:catInfo("S",n)})).sort((x,y)=>y.s-x.s);
  const tb=budTot(month);const mode=tb?"tot":rows.length?"cat":"";

  const totB=tb?tb.v:catB,totS=tb?r2(act.reduce((t,x)=>t+x.v,0)):r2(rows.reduce((t,x)=>t+x.s,0)),totP=tb?r2(plan.reduce((t,x)=>t+x.v,0)):r2(rows.reduce((t,x)=>t+x.p,0));

async function submitTx(again){readTx();const s=S.sheet;const v=parseAmount(s.v);const fail=m=>{s.err=m;drawSheet()};

  const id=s.id||newId();const prev=s.id?S.items.get(s.id):null;

  render();await write(B.saveTx(id,item,prev),s.id?"Movimento aggiornato":item.d>TODAY?"Movimento previsto salvato":again?"Salvato, inserisci il prossimo":"Movimento salvato");render()}

async function submitAcc(){readAcc();const s=S.sheet;const n=s.n.trim();const c=clone();const want=s.bal.trim()?parseAmount(s.bal):0;

async function submitExp(){readExp();const s=S.sheet;

  catch(e){s.busy=false;s.err="Non riesco a preparare il file. Controlla la connessione e riprova.";if(S.sheet===s)drawSheet()}}

  else if(t.dataset&&t.dataset.pdft!=null&&S.pdf){S.pdf.rows[+t.dataset.pdft].titolo=t.value.trim()||"Operazione"}
  else if(t.dataset&&t.dataset.pdfv!=null&&S.pdf){const v=parseAmount(t.value);if(isFinite(v)){S.pdf.rows[+t.dataset.pdfv].v=Math.round(v*100)/100;render()}else toast("Scrivi un numero, ad esempio -4,96.")}
  else if(t.id==="pdfFile"&&t.files&&t.files[0]){const f=t.files[0];t.value="";const b=g2("pdfB"),r=g2("pdfR");S.pdf={broker:b,regime:r,file:f.name,busy:true,rows:null,err:"",raw:"",sells:0};render();
    (/\.csv$/i.test(f.name)||f.type==="text/csv"?f.text().then(tx=>{const res=parseTradeCSV(tx);Object.assign(S.pdf,{busy:false,rows:res.rows,sells:res.sells,err:res.err||"",raw:"",csv:true,hasTax:res.hasTax});if(res.hasTax&&!S.pdf.regime)S.pdf.regime="Amministrato";if(res.hasTax)S.pdf.regime="Amministrato"}).catch(()=>{Object.assign(S.pdf,{busy:false,err:"Non riesco a leggere questo file."})}).then(render):
    pdfLines(f).then(lines=>{const res=parseStatement(lines);Object.assign(S.pdf,{busy:false,rows:res.rows,sells:res.sells,raw:lines.slice(0,120).join("\n")})}).catch(()=>{Object.assign(S.pdf,{busy:false,err:"Non riesco a leggere questo PDF (serve la connessione per caricare il lettore). Riprova."})}).then(render))}
  else if(t.id==="impFile"&&t.files&&t.files[0]){importFile(t.files[0]);t.value=""}
  else if(t.id==="txD"&&S.sheet){readTx();drawSheet()}
  else if(t.id==="hideBal"&&S.sheet){S.sheet.hide=t.checked;drawSheet()}
  else if(t.id==="hideBalSet"){S.hideBal=t.checked;lsSet("hide",S.hideBal);render()}
  else if(t.id==="pAll"&&S.sheet){S.sheet.all=t.checked;if(t.checked){S.sheet.a=null;S.sheet.b=null}const box=document.getElementById("calScroll");const st=box?box.scrollTop:0;drawSheet();const nb=document.getElementById("calScroll");if(nb)nb.scrollTop=st}});
let qT;document.addEventListener("input",e=>{if(e.target.id==="fq"){S.f.q=e.target.value;S.shown=150;clearTimeout(qT);qT=setTimeout(render,200)}});

  if(B.kind==="gas"){try{google.script.url.getLocation(l=>go(l&&l.parameter&&l.parameter.azione))}catch(e){}}else go((location.hash||"").slice(1))}
render();
B.start().then(render).catch(()=>{S.ready=true;S.mode="local";render();toast("Non riesco a leggere l'archivio. Ricarica la pagina.")});
if(window.google&&google.script&&google.script.run){gasCall("getAccount").then(r=>{S.fbu=typeof r==="string"?JSON.parse(r):r;if(S.view==="impostazioni")render()}).catch(()=>{})}
